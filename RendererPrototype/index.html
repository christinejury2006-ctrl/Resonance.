<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050608"><title>Dragonbound — Cinematic Renderer</title></head>
<body><main id="app"><canvas id="application"></canvas><section class="hud"><div class="brand">DRAGONBOUND</div><div class="sub">CINEMATIC RENDER PROTOTYPE</div><div id="status">INITIALIZING RENDERER…</div></section><div class="vignette"></div><aside id="animation-panel" class="animation-panel" hidden>
  <div class="panel-kicker">ANIMATION PREVIEW</div>
  <div id="animation-name" class="animation-name">—</div>
  <div id="animation-list" class="animation-list"></div>
  <div class="animation-controls">
    <button id="play-toggle" type="button">PLAY</button>
    <button id="loop-toggle" class="active" type="button">LOOP ON</button>
    <select id="speed-select" aria-label="Playback speed">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
  </div>
  <input id="timeline" class="timeline" type="range" min="0" max="1" step="0.01" value="0" aria-label="Animation timeline">
  <div id="time-readout" class="time-readout">0.00 / 0.00</div>
</aside><div id="error" class="error" hidden></div></main><script type="module" src="/src/main.js"></script></body>
</html>
