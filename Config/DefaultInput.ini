; Dragonbound — input configuration.
;
; Dragonbound uses Unreal's Enhanced Input framework exclusively (no legacy
; input). Declaring the default classes here means every input component in
; the project is Enhanced Input from day one.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
