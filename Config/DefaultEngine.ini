; Dragonbound — engine configuration.
;
; Intentionally minimal at Phase 0; project-specific settings are added as
; real systems land in each milestone:
;   M1: Enhanced Input classes (DefaultInput.ini), default game mode,
;       rendering baseline (this file).
;   M3: Gameplay Ability System defaults, damage/attribute settings.
;
; Rules:
;   - Every entry must have a one-line rationale comment.
;   - Never hand-edit EditorPerProjectUserSettings.ini — it is local-only.

[/Script/EngineSettings.GameMapsSettings]
; M1: default game mode is the C++ Rider game mode.
; The grey-box map, input config data asset, and appearance definitions are
; authored in-editor — see Docs/EDITOR_SETUP.md.
GlobalDefaultGameMode=/Script/Dragonbound.DBRiderGameMode
GameDefaultMap=/Game/Dragonbound/Maps/DB_Map_M1Greybox

[/Script/Engine.RendererSettings]
; M1 rendering baseline per Docs/VISUAL_STYLE.md §2.1:
; Lumen global illumination + reflections, virtual shadow maps, TSR upscaling.
; Scalability presets (Low..Epic) are tuned in a later milestone (M5).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=True
r.AntiAliasingMethod=4
