<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Port Harcourt Life — Nigeria Life Simulator</title>
<style>
:root{--ink:#f5f1e8;--muted:#b9b5ad;--panel:rgba(13,17,19,.86);--line:rgba(255,255,255,.12);--accent:#d9a441;--green:#6f9c72}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1110;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand,.chip,.panel,.hint{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.24)}
.brand{padding:10px 13px;border-radius:14px}.brand b{display:block;font-size:14px;letter-spacing:.02em}.brand span{font-size:11px;color:var(--muted)}
.chip{padding:9px 11px;border-radius:999px;font-size:11px;color:#ddd;white-space:nowrap}
#panel{position:absolute;right:14px;top:90px;width:min(330px,calc(100vw - 28px));border-radius:18px;padding:17px;transform:translateX(calc(100% + 30px));transition:transform .28s ease;pointer-events:auto}
#panel.open{transform:none}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}h2{font-size:22px;margin:5px 0 3px}p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stat{padding:10px;border:1px solid var(--line);border-radius:11px}.stat b{display:block;font-size:14px}.stat span{font-size:10px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:13px}.btn{border:1px solid var(--line);background:#1c2423;color:var(--ink);padding:10px 12px;border-radius:10px;font-weight:650;font-size:11px}.btn.primary{background:var(--accent);color:#16120b;border-color:transparent}
.bottom{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;gap:12px}
.hint{padding:9px 12px;border-radius:12px;font-size:10px;color:var(--muted);max-width:260px}
.legend{display:flex;gap:7px}.legend span{padding:8px 10px;border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:10px}
#toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,12px);opacity:0;background:#f3ead7;color:#15130e;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:700;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#close{position:absolute;right:12px;top:10px;background:none;border:0;color:#aaa;font-size:20px}
@media(max-width:600px){.chip{display:none}.bottom{align-items:end}.hint{font-size:9px;max-width:220px}#panel{top:auto;bottom:74px;right:10px}}
</style>
</head>
<body>
<div id="hud">
  <div class="top"><div class="brand"><b>PORT HARCOURT LIFE</b><span>Prototype 01 · Rivers State</span></div><div class="chip">REAL-WORLD FOUNDATION · OSM</div></div>
  <aside id="panel" class="panel"><button id="close">×</button><div class="eyebrow" id="ptype">HOUSEHOLD</div><h2 id="pname">Select a home</h2><p id="pdesc">Tap a building to inspect the household living there.</p><div class="stats" id="stats"></div><div class="actions"><button class="btn primary" id="enter">Enter home</button><button class="btn" id="visit">Visit</button></div></aside>
  <div class="bottom"><div class="hint">Drag to orbit · pinch to zoom · tap a building to inspect its household</div><div class="legend"><span>Homes</span><span>Shops</span></div></div>
  <div id="toast">Prototype loaded</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9db2a0);
scene.fog=new THREE.Fog(0x9db2a0,95,185);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,500);
camera.position.set(44,48,52);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true;
controls.dampingFactor=.07;
controls.minDistance=22; controls.maxDistance=110;
controls.maxPolarAngle=Math.PI*.46;
controls.minPolarAngle=.35;
controls.screenSpacePanning=true;

scene.add(new THREE.HemisphereLight(0xe9f1e9,0x405044,2.0));
const sun=new THREE.DirectionalLight(0xffe5bd,3.1);
sun.position.set(-45,75,30);sun.castShadow=true;
sun.shadow.mapSize.set(1536,1536);
sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;
scene.add(sun);

const mats={
 road:new THREE.MeshStandardMaterial({color:0x292b2a,roughness:.92}),
 asphalt2:new THREE.MeshStandardMaterial({color:0x3b3b37,roughness:.95}),
 concrete:new THREE.MeshStandardMaterial({color:0xaaa49a,roughness:.9}),
 wall:new THREE.MeshStandardMaterial({color:0xc7b8a0,roughness:.92}),
 wall2:new THREE.MeshStandardMaterial({color:0xb98f70,roughness:.9}),
 roof:new THREE.MeshStandardMaterial({color:0x6d3427,roughness:.86}),
 roof2:new THREE.MeshStandardMaterial({color:0x343536,roughness:.85}),
 green:new THREE.MeshStandardMaterial({color:0x31583b,roughness:1}),
 leaf:new THREE.MeshStandardMaterial({color:0x4f7a4b,roughness:1}),
 dirt:new THREE.MeshStandardMaterial({color:0x9a6d4d,roughness:1}),
 water:new THREE.MeshStandardMaterial({color:0x6f8e9a,roughness:.2,metalness:.05}),
 metal:new THREE.MeshStandardMaterial({color:0x565957,roughness:.55,metalness:.5}),
 cream:new THREE.MeshStandardMaterial({color:0xe1d3b6,roughness:.8}),
 sign:new THREE.MeshStandardMaterial({color:0x1e4f3a,roughness:.8})
};
function box(w,h,d,mat,x,y,z,cast=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;scene.add(m);return m;
}
function cyl(r,h,mat,x,y,z,seg=12){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function road(x,z,w,d){
 box(w,.16,d,mats.road,x,.08,z,false);
}
function gutter(x,z,w,d){
 box(w,.16,d,mats.concrete,x,.16,z,false);
}
function tree(x,z,s=1){
 const trunk=cyl(.22,2.3,mats.wall2,x,1.15,z,9);
 const crown=cyl(1.45*s,2.8*s,mats.leaf,x,3.05*s,z,10);
 crown.rotation.y=Math.random();
}
function house({x,z,w=7,d=6,h=3.3,mat=mats.wall,roof=mats.roof,stories=1,name,type='Home',family}){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;g.add(body);
 const roofM=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,1.8,4),roof);roofM.position.y=h+.7;roofM.rotation.y=Math.PI/4;roofM.castShadow=true;g.add(roofM);
 // front veranda
 const porch=new THREE.Mesh(new THREE.BoxGeometry(w*.72,.12,.8),mats.concrete);porch.position.set(0,.06,d/2+.35);porch.receiveShadow=true;g.add(porch);
 // windows
 for(let i=-1;i<=1;i+=2){const win=new THREE.Mesh(new THREE.BoxGeometry(1.05,1.05,.08),mats.water);win.position.set(i*w*.24,h*.54,d/2+.04);g.add(win)}
 // gate/wall
 const wall=new THREE.Mesh(new THREE.BoxGeometry(w+2,.95,.16),mats.wall2);wall.position.set(0,.48,d/2+1.55);wall.castShadow=true;g.add(wall);
 const gate=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.35,.12),mats.metal);gate.position.set(0,.68,d/2+1.45);g.add(gate);
 // water tank
 const tank=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,1.25,14),mats.water);tank.position.set(w*.28,h+1.65,-d*.2);tank.castShadow=true;g.add(tank);
 // generator
 const gen=new THREE.Mesh(new THREE.BoxGeometry(.65,.55,.8),mats.metal);gen.position.set(-w*.32,.3,d/2+.75);gen.castShadow=true;g.add(gen);
 g.position.set(x,0,z);scene.add(g);
 g.userData={name,type,family,w,d,description:stories>1?'Two-storey family home with a gated compound.':'Family bungalow with a small compound, generator and rooftop water tank.',income:family.income,people:family.people,job:family.job,mood:family.mood};
 return g;
}
function shop(x,z,w,d,name,label){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(w,3.4,d),mats.wall2);body.position.y=1.7;body.castShadow=true;body.receiveShadow=true;g.add(body);
 const awn=new THREE.Mesh(new THREE.BoxGeometry(w+1,.18,1.0),mats.sign);awn.position.set(0,2.9,d/2+.45);g.add(awn);
 const sign=new THREE.Mesh(new THREE.BoxGeometry(w*.72,.7,.06),mats.cream);sign.position.set(0,3.65,d/2+.04);g.add(sign);
 g.position.set(x,0,z);g.userData={name,type:'Business',family:{people:'—',job:label,income:'Local business',mood:'Open'}};scene.add(g);return g;
}
function car(x,z,rot=0,scale=1){
 const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(2.1,.7,4),new THREE.MeshStandardMaterial({color:Math.random()>.5?0x8d2d22:0xddd1b7,roughness:.7}));b.position.y=.48;g.add(b);
 const top=new THREE.Mesh(new THREE.BoxGeometry(1.65,.62,2.0),new THREE.MeshStandardMaterial({color:0x252b2d,roughness:.4}));top.position.set(0,.96,-.05);g.add(top);
 g.position.set(x,.1,z);g.rotation.y=rot;g.scale.setScalar(scale);scene.add(g);
}
function pole(x,z){
 const p=cyl(.08,7,mats.metal,x,3.5,z,8);const arm=box(2.3,.08,.08,mats.metal,x+1.1,6.55,z,false);return p;
}

road(0,0,10,150);road(0,0,150,10);
road(-38,0,7,150);road(38,0,7,150);road(0,-35,150,7);road(0,35,150,7);
gutter(-5.65,0,.55,150);gutter(5.65,0,.55,150);gutter(0,-5.65,150,.55);gutter(0,5.65,150,.55);
box(150,.18,150,mats.dirt,0,-.02,0,false);

// lane markings
for(let z=-68;z<68;z+=7) box(.16,.025,3.4,mats.cream,0,.18,z,false);
for(let x=-68;x<68;x+=7) box(3.4,.025,.16,mats.cream,x,.18,0,false);

// neighbourhood buildings / households
const homes=[
{x:-17,z:-16,w:8,d:7,mat:mats.cream,name:'The Ebi Family',family:{people:'4 Sims',income:'₦420k/mo',job:'Civil engineer + teacher',mood:'Busy'}},
{x:18,z:-17,w:7,d:7,mat:mats.wall,name:'The George Household',family:{people:'3 Sims',income:'₦280k/mo',job:'Trader + student',mood:'Social'}},
{x:-18,z:17,w:9,d:7,mat:mats.wall2,name:'The Amadi Family',family:{people:'5 Sims',income:'₦610k/mo',job:'Doctor + entrepreneur',mood:'Comfortable'}},
{x:18,z:18,w:8,d:8,mat:mats.cream,name:'The Wali Household',family:{people:'2 Sims',income:'₦190k/mo',job:'Designer + freelancer',mood:'Creative'}},
{x:-28,z:-29,w:6,d:6,mat:mats.wall,name:'The Briggs Home',family:{people:'6 Sims',income:'₦350k/mo',job:'Business + civil service',mood:'Lively'}},
{x:29,z:29,w:7,d:6,mat:mats.wall,name:'The Nwoko Home',family:{people:'3 Sims',income:'₦510k/mo',job:'Lawyer + consultant',mood:'Calm'}}
];
const objects=homes.map(h=>house({...h,type:'Home'}));
shop(-29,-12,7,6,'Mama Ebi Provision Store','Provision shop');
shop(29,-12,7,6,'Rumu Market Kitchen','Food vendor');
shop(-29,12,7,6,'Rivers Pharmacy','Pharmacy');
shop(29,12,7,6,'PH Tech Hub','Phone & tech');

for(let i=-65;i<=65;i+=13){tree(-10,i,.8+Math.random()*.5);tree(10,i,.7+Math.random()*.5);tree(i,-10,.65+Math.random()*.45);tree(i,10,.75+Math.random()*.4)}
for(let i=-60;i<=60;i+=20){pole(-7,i);pole(7,i);pole(i,-7);pole(i,7)}
car(-2,-24,0,1);car(2,24,Math.PI,1);car(-24,2,Math.PI/2,.9);car(24,-2,-Math.PI/2,1);
car(-48,-10,0,.8);car(48,10,Math.PI,.8);

// roadside kiosks
for(const [x,z] of [[-12,-8],[12,8],[-12,8],[12,-8]]){box(2.6,2.1,2.0,mats.wall2,x,1.05,z);box(2.9,.16,2.4,mats.roof,x,2.25,z)}

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
const panel=document.getElementById('panel'),nameEl=document.getElementById('pname'),descEl=document.getElementById('pdesc'),stats=document.getElementById('stats');
let selected=null;
function selectObject(o){
 selected=o;panel.classList.add('open');
 const d=o.userData;
 document.getElementById('ptype').textContent=d.type==='Business'?'BUSINESS':'HOUSEHOLD';
 nameEl.textContent=d.name;
 descEl.textContent=d.description || 'A simulated place in the Port Harcourt prototype.';
 stats.innerHTML='<div class="stat"><b>'+d.people+'</b><span>Residents</span></div><div class="stat"><b>'+d.income+'</b><span>Household / status</span></div><div class="stat"><b>'+d.job+'</b><span>Work</span></div><div class="stat"><b>'+d.mood+'</b><span>Current state</span></div>';
}
function pick(e){
 const r=renderer.domElement.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width*2-1,y=-((e.clientY-r.top)/r.height)*2+1;
 pointer.set(x,y);ray.setFromCamera(pointer,camera);
 const hits=ray.intersectObjects(scene.children,true);
 let found=null;
 for(const h of hits){let o=h.object;while(o.parent && !o.userData?.name)o=o.parent;if(o.userData?.name){found=o;break}}
 if(found)selectObject(found);
}
renderer.domElement.addEventListener('pointerup',pick);
document.getElementById('close').onclick=()=>panel.classList.remove('open');
document.getElementById('enter').onclick=()=>showToast(selected?.type==='Business'?'Entering business simulation next.':'Home interior system ready for the next build layer.');
document.getElementById('visit').onclick=()=>showToast('Visit action queued for the household simulation layer.');
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),2200)}
showToast('Port Harcourt prototype loaded');

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75))});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
</body>
</html>
